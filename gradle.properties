# Disable foojay toolchain auto checking
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Disable bytecode improvement
# TODO：Gradle 8.8 has some questions between JDK21
org.gradle.internal.instrumentation.enabled=false


